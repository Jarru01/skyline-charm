options:
  # ── Identity: explicit credentials (optional when the relation is used) ──
  keystone-url:
    type: string
    default: ""
    description: |
      Full Keystone v3 endpoint URL, e.g. https://10.0.0.1:5000/v3/
      The charm will append /v3/ if not already present.
      To find your endpoint:
        openstack endpoint list --service keystone --interface public
      Not needed when the identity-credentials relation provides credentials
      (see identity-username).

  system-user-password:
    type: string
    default: ""
    description: |
      Password for the 'skyline' OpenStack service user.
      This user must exist in Keystone before deploying the charm.
      Create it with:
        openstack user create --domain admin_domain --password-prompt skyline
        openstack role add --project admin --user skyline admin
        openstack role add --user skyline --user-domain admin_domain --system all admin
      The roles must be lowercase 'admin' (oslo.policy role matching is
      case-sensitive; rename Juju's stock 'Admin' role first).
      The system-scope grant is required by system-scoped admin APIs;
      without it some administrator panels return 403 / empty data.
      Not needed when the identity-credentials relation provides credentials.

  # ── Database ──────────────────────────────────────────────────────────
  database-password:
    type: string
    default: ""
    description: |
      Password for the local MariaDB skyline user.
      Only used for the local MariaDB (no mysql-router shared-db relation).
      If left empty, a random password is generated on first install and
      stored in the charm's StoredState.

  # ── OpenStack identity ────────────────────────────────────────────────
  default-region:
    type: string
    default: "RegionOne"
    description: OpenStack region name.

  system-user-name:
    type: string
    default: "skyline"
    description: Name of the OpenStack service user for Skyline.

  system-user-domain:
    type: string
    default: "admin_domain"
    description: Domain of the Skyline service user.

  system-project:
    type: string
    default: "admin"
    description: System project that Skyline uses for admin-level API calls.

  system-project-domain:
    type: string
    default: "admin_domain"
    description: Domain of the admin project.

  identity-username:
    type: string
    default: "skyline"
    description: |
      Username requested from the keystone charm over the
      identity-credentials relation. Only used when the relation is present;
      the keystone charm creates (or reuses) this service user and returns
      its generated password.

  identity-project:
    type: string
    default: "admin"
    description: |
      Project the identity-credentials user is created in / granted on.
      Defaults to the admin project, which is what Skyline needs. Must match
      an existing project, otherwise the keystone charm creates a new one.

  identity-project-domain:
    type: string
    default: "admin_domain"
    description: |
      Domain of the identity-credentials user/project. Must match the domain
      of the existing skyline user (default: admin_domain), otherwise a
      second user is created in the given domain.

  interface-type:
    type: string
    default: "public"
    description: |
      OpenStack endpoint interface type used by the APIServer.
      One of: public, internal, admin.

  # ── Network / TLS ─────────────────────────────────────────────────────
  listen-port:
    type: int
    default: 9999
    description: |
      TCP port on which nginx will listen for browser traffic.
      Port 9999 is used by default to avoid conflicts with Horizon
      which typically occupies 80/443.

  ssl-enabled:
    type: boolean
    default: false
    description: |
      Set ssl_enabled in skyline.yaml. NOTE: this only controls the URL
      scheme Skyline builds for the WebSSO redirect (and any SSO URL); it
      does not serve or verify TLS. It is forced to true automatically while
      the `certificates` relation provides TLS. To serve nginx over HTTPS
      (and to verify outbound TLS), use the `certificates` relation.

  tls-port:
    type: int
    default: 443
    description: |
      HTTPS port nginx listens on while the `certificates` relation provides
      a certificate. The plain listener (`listen-port`, default 9999) is kept
      and redirects to this port unless `tls-redirect` is disabled.

  tls-redirect:
    type: boolean
    default: true
    description: |
      With TLS active, redirect plain HTTP (`listen-port`) to HTTPS
      (`tls-port`) with a 301. Disable to keep serving the dashboard over
      plain HTTP as well.

  cafile:
    type: string
    default: ""
    description: |
      Path to a CA bundle used to verify outbound TLS to OpenStack services
      (both the apiserver sessions and nginx's proxy_ssl_verify upstream
      leg). When empty (default), the CA delivered by the `certificates`
      relation is used automatically — but only if it validates every HTTPS
      endpoint in the Keystone catalog; otherwise verification stays off
      (the pre-TLS behaviour) and the failures are logged. Plain-HTTP
      endpoints (e.g. heat) are never affected by TLS verification.

  # ── Skyline application ───────────────────────────────────────────────
  debug:
    type: boolean
    default: false
    description: Enable debug logging in skyline-apiserver.

  secret-key:
    type: string
    default: ""
    description: |
      Session encryption secret key. All skyline units must use the SAME
      value (sessions are signed with it), so in HA deployments the leader
      auto-generates one key and shares it with every unit over the
      skyline-peers relation.
      Setting an explicit value here seeds or rotates the key across all
      units. WARNING: changing it invalidates all active user sessions.

  prometheus-endpoint:
    type: string
    default: ""
    description: |
      Prometheus endpoint URL used by the Monitor pages.
      The scheme is REQUIRED, e.g. http://10.0.0.3:9090 — a bare
      host:port (10.0.0.3:9090) makes the apiserver return HTTP 500
      and the monitoring overview shows no data.
      Leave empty to disable Prometheus integration.

  prometheus-enable-basic-auth:
    type: boolean
    default: false
    description: Enable HTTP Basic Auth when scraping Prometheus.

  prometheus-basic-auth-user:
    type: string
    default: ""
    description: Prometheus Basic Auth username (if enabled).

  prometheus-basic-auth-password:
    type: string
    default: ""
    description: Prometheus Basic Auth password (if enabled).

  sso-enabled:
    type: boolean
    default: false
    description: Enable SSO authentication in skyline.

  sso-region:
    type: string
    default: "RegionOne"
    description: Region used for SSO authentication.

  enforce-new-defaults:
    type: boolean
    default: false
    description: |
      Enforce new RBAC policy defaults (enforce_new_defaults in skyline.yaml).
      Only enable if your Keystone policy is configured for new-style RBAC.

  reclaim-instance-interval:
    type: int
    default: 604800
    description: |
      Interval (in seconds) after which soft-deleted instances are reclaimed.
      Default is 604800 (7 days).

  # ── gunicorn tuning ───────────────────────────────────────────────────
  gunicorn-workers:
    type: int
    default: 0
    description: |
      Number of gunicorn worker processes.
      Set to 0 (default) to auto-detect based on CPU count (cpu_count()).

  gunicorn-timeout:
    type: int
    default: 300
    description: gunicorn worker timeout in seconds.
