db-sync:
  description: |
    Manually trigger a database schema migration (alembic upgrade head).
    Safe to run at any time — Alembic is idempotent.

get-static-path:
  description: |
    Print the filesystem path where skyline-console static assets are installed.
    Useful for troubleshooting nginx 404 errors.

restart-services:
  description: Restart skyline-apiserver and reload nginx.

show-config:
  description: |
    Print the rendered /etc/skyline/skyline.yaml to the action output.
    WARNING: output includes the system-user-password in plaintext.
    Use only for debugging in a trusted environment.

regenerate-nginx:
  description: |
    Regenerate /etc/nginx/nginx.conf from the keystone catalog using the
    shipped skyline-nginx-generator, then test and reload nginx. Use after
    the keystone service catalog changes (new regions/services/endpoints).

patch-frontend:
  description: |
    Patch the container-infra JS bundle to fix a checkVolumeQuota TypeError
    that crashes the Create Cluster page when cinder is not in the service
    catalog. Idempotent — safe to run multiple times.

patch-kubeconfig:
  description: |
    Inject the kubeconfig-download backend endpoint and patch the
    skyline-console JS bundles so every cluster row has a working
    "Download Kubeconfig" button. Idempotent — safe to run multiple times.
    Restarts skyline-apiserver to load the new endpoint.
